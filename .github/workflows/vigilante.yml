name: Vigilante Amazon

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Recuperar historial de precios
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: historial-${{ github.run_id }}
          restore-keys: historial-

      - name: Vigilar precios
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # GitHub retrasa las ejecuciones programadas (a veces 45 min o más),
          # así que cada ejecución hace 6 pasadas, una cada 10 minutos.
          for i in 1 2 3 4 5 6; do
            echo "===== Pasada $i de 6 ====="
            python3 vigilante.py || true
            if [ "$i" -lt 6 ]; then sleep 540; fi
          done

      - name: Guardar historial de precios
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado
          key: historial-${{ github.run_id }}
